# SonarCloud configuration
sonar.projectKey=ilhamridzuan_inveeta
sonar.organization=ilhamridzuan

# Source & Test paths
sonar.sources=apps,packages
sonar.tests=apps/api/test

# Test files pattern
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/api/test/**

# Exclude build output, third-party libraries, database migrations, and docs from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/public/**,packages/db/src/migrations/**,docs/**,**/*.config.ts,**/*.config.js,**/coverage/**

# Exclude test files and seeds from Duplication (CPD) checks
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/api/test/**,packages/db/src/seeds/**
