<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inveeta - Tidak Ada Koneksi Internet</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      border-radius: 1.25rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 2.25rem 2rem;
      text-align: center;
    }
    .icon-container {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background-color: #fef3c7;
      color: #d97706;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }
    .icon-container svg {
      width: 2rem;
      height: 2rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: 0.625rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background-color: #f59e0b;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39m3.66-.16a10.9 10.9 0 013.89 1M12 20h.01M8.53 16.11a6 6 0 016.95 0M10.66 18.5a2 2 0 012.68 0" />
      </svg>
    </div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Inveeta memerlukan koneksi internet aktif untuk memuat metrik real-time dan memperbarui data tamu. Halaman akan dimuat ulang secara otomatis saat koneksi Anda kembali online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Coba Muat Ulang
    </button>
    <div class="status-badge">
      <span class="dot"></span>
      <span>Menunggu koneksi terhubung kembali...</span>
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
