name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: inveeta_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Lint
        run: pnpm turbo lint

      - name: Turbo Typecheck
        run: pnpm turbo typecheck

      - name: Migrate Database Schema & Seed Data
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/inveeta_dev"
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Turbo Test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/inveeta_dev"
          BETTER_AUTH_SECRET: "dummy_secret_for_ci_build_minimum_32_characters_long"
          BETTER_AUTH_URL: "http://localhost:3000"
        run: pnpm turbo test

      - name: Turbo Build
        env:
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/inveeta_dev"
          BETTER_AUTH_SECRET: "dummy_secret_for_ci_build_minimum_32_characters_long"
          BETTER_AUTH_URL: "http://localhost:3000"
          GOOGLE_CLIENT_ID: "dummy_google_client_id"
          GOOGLE_CLIENT_SECRET: "dummy_google_client_secret"
          RESEND_API_KEY: "dummy_resend_api_key"
          R2_ACCOUNT_ID: "dummy_r2_account_id"
          R2_ACCESS_KEY_ID: "dummy_r2_access_key_id"
          R2_SECRET_ACCESS_KEY: "dummy_r2_secret_access_key"
          R2_BUCKET_NAME: "inveeta-storage"
          REVALIDATION_SECRET: "dummy_revalidation_secret_for_ci"
          INVITATION_APP_URL: "http://localhost:3001"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:5173"
        run: pnpm turbo build
